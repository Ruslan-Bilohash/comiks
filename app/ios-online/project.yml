# Komiks·Lab для iPhone — онлайн-клієнт (як Android 1.3): вікно з сайтом + оплата StoreKit 2.
# Проєкт Xcode генерує XcodeGen на Codemagic: `xcodegen generate` (див. codemagic.yaml → ios-online).
name: KomiksLab
options:
  bundleIdPrefix: com.bilohash
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "1.0.2"        # 1.0.2: продаж Premium (StoreKit, перша підписка йде на перевірку з цією версією), системне вікно відгуку App Store; 1.0.1 — «Sign in with Apple»
    CURRENT_PROJECT_VERSION: "2"      # на Codemagic номер збірки = останній у TestFlight + 1 (agvtool)
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  KomiksLab:
    type: application
    platform: iOS
    sources:
      - path: KomiksLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bilohash.comiks
        PRODUCT_NAME: KomiksLab   # назва на екрані — CFBundleDisplayName «Komiks·Lab» в Info.plist
        INFOPLIST_FILE: KomiksLab/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
    # «Sign in with Apple» (1.0.1): capability увімкнено в App ID com.bilohash.comiks; профіль підпису має її містити
    # (профіль, створений до ввімкнення, — перевипустити). XcodeGen сам пише файл і CODE_SIGN_ENTITLEMENTS.
    entitlements:
      path: KomiksLab/KomiksLab.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    # Покупки в застосунку (StoreKit) окремого entitlement не потребують; Apple Pay тут НЕ використовується.
